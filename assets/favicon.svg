<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Interim monogram: her initials on the site's navy, the accent blue as
       the counter-stroke. Replaced by her vectorised signature the day she
       supplies it on paper; the head links here so only this file changes. -->
  <rect width="64" height="64" rx="8" fill="#131c2e"/>
  <text x="32" y="42" font-family="Archivo, Arial, sans-serif" font-size="28"
        font-weight="800" text-anchor="middle" fill="#f7f9fc"
        letter-spacing="1">B<tspan fill="#2f6fdb">T</tspan></text>
</svg>
