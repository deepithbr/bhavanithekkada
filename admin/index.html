<title>Journal editor | Bhavani Thekkada</title>
<!--
  Her writing room.

  Decap CMS, the open-source git-based editor. She signs in with her own
  GitHub account, writes in a clean editor, presses Publish, and the entry
  is committed to content/journal as a markdown file. Cloudflare sees the
  commit and rebuilds the site; the post is live in about a minute. No
  separate platform, no fees, and every entry is version-controlled with
  the rest of the site.

  Sign-in runs through /api/auth and /api/callback, the two Pages Functions
  beside the enquiry endpoint. They hold the GitHub OAuth secret server-side;
  nothing sensitive ships in this page.
-->
